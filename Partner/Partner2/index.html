
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1 id="greeting">Hello User!</h1>
    <p id="message">Welcome to my website!</p>

    <h2>Customize Your Page</h2>

    <form id="customize-form">
        <label for="name">Enter your name:</label>
        <input type="text" id="name">

        <label for="new-message">Enter a message:</label>
        <input type="text" id="new-message">

        <label for="color">Choose a background color:</label>
        <select id="color">
            <option value="white">White</option>
            <option value="lightblue">Light Blue</option>
            <option value="lightgreen">Light Green</option>
            <option value="lightpink">Light Pink</option>
            <option value="lightyellow">Light Yellow</option>
        </select>

        <button type="submit">Apply Changes</button>
    </form>

    <h2>To Do List</h2>

    <form id="todo-form">
        <label for="task">Enter a task:</label>
        <input type="text" id="task" required>
        <button type="submit">Add Task</button>
    </form>

    <ol id="todo-list"></ol>

</body>
</html>
